# Netlify deployment settings: how to build the site, and the security headers sent with every page.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Preview builds are hidden from search engines ---
# Preview links can be opened by anyone who has the address, so every page on a preview or branch build is marked noindex.
# The live (production) site is not affected.
[context.deploy-preview.environment]
  PUBLIC_NOINDEX = "true"
[context.branch-deploy.environment]
  PUBLIC_NOINDEX = "true"

# --- Security headers (all pages) ---
# Content-Security-Policy: the browser may only load code, images and fonts from the places listed here.
# IF YOU CONNECT A FORM OR EMAIL SERVICE: add its web address to connect-src below (for example https://formspree.io),
# otherwise the browser will block the form from sending. Add https://cdn.sanity.io only if you switch the CMS on (already allowed for images).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.sanity.io; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"

# --- Caching: built files have unique names, so they can be kept for a year ---
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --- Redirects from addresses on the current website, so existing links keep working ---
# Add more here if you give us a list of other old addresses.
[[redirects]]
  from = "/academy"
  to = "/training-and-mentorship"
  status = 301
  force = true

[[redirects]]
  from = "/academy/*"
  to = "/training-and-mentorship"
  status = 301
  force = true
